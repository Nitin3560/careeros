name: Publish recent jobs page

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/render_entry_jobs_page.py"
      - ".github/workflows/publish-recent-jobs-page.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render the recent jobs feed
        run: python scripts/render_entry_jobs_page.py --readme README.md --output site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
