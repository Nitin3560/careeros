[project]
name = "careeros-api"
version = "0.1.0"
description = "FastAPI backend for CareerOS"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "bcrypt==4.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=2.53.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.12",
    "pydantic[email]>=2.13.4",
    "python-docx>=1.2.0",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.0",
    "redis>=7.1.0",
    "rq>=2.6.1",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
