services:
  db:
    image: pgvector/pgvector:pg16
    container_name: careeros_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: careeros_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  poller:
    profiles: ["poller"]
    build:
      context: ./apps/api
    restart: unless-stopped
    command: ["python", "-m", "app.ingestion.poller.cli"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POLLER_EXPIRY_ENABLED: ${POLLER_EXPIRY_ENABLED:-false}
      POLLER_RETENTION_ENABLED: ${POLLER_RETENTION_ENABLED:-false}
      POLLER_CONCURRENCY: ${POLLER_CONCURRENCY:-64}
    depends_on:
      - db

volumes:
  postgres_data:
  redis_data:
